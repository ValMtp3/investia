# Config LiteLLM — D43 : OpenRouter pour GPT-6 Luna + Jev, Mistral en direct pour Mistral Large 4.
# Tout passe quand même par le gateway LiteLLM (un seul point d'appel côté backend).
model_list:
  - model_name: gpt-6-luna
    litellm_params:
      model: openrouter/openai/gpt-6-luna
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: mistral-large-4
    litellm_params:
      model: mistral/mistral-large-4
      api_base: https://api.mistral.ai/v1
      api_key: os.environ/MISTRAL_API_KEY
  # Decision model (D44 : elephant-1 de Baseten remplace Jev) — /v1/decisions et /v1/systemone, via OpenRouter (gratuit)
  - model_name: elephant
    litellm_params:
      model: openrouter/baseten/elephant-1
      api_key: os.environ/OPENROUTER_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/LITELLM_DATABASE_URL

# Prod (VPS) — aucun port publié sur 0.0.0.0. NPM tourne en network_mode: host sur ce VPS
# (D54) : il atteint notre pile en localhost. Seuls dashboard et authelia écoutent sur
# 127.0.0.1, joignable uniquement depuis le VPS lui-même (jamais depuis l'extérieur ni
# depuis un autre conteneur). backend/tests/test_compose.py veille à cette règle.
services:
  postgres:
    restart: unless-stopped
    environment:
      AUTHELIA_DB_PASSWORD: ${AUTHELIA_DB_PASSWORD:?AUTHELIA_DB_PASSWORD est requis en prod}
  redis:
    restart: unless-stopped
  backend:
    restart: unless-stopped
  litellm:
    restart: unless-stopped
  dashboard:
    restart: unless-stopped
    environment:
      EDGE_SECRET: ${EDGE_SECRET:?EDGE_SECRET est requis en prod (secret partagé avec NPM, voir le guide)}
    # Port loopback pour NPM (host), D54 : 127.0.0.1 uniquement, jamais 0.0.0.0.
    # À changer seulement si le port est pris sur le VPS : DASHBOARD_LOOPBACK_PORT dans .env.
    ports:
      - "127.0.0.1:${DASHBOARD_LOOPBACK_PORT:-8080}:80"
  # Connexion (D50). En prod seulement : en local, aucun Authelia ni NPM devant le dashboard.
  # Port loopback comme dashboard : NPM (host) appelle 127.0.0.1 pour le portail /auth
  # et le point de contrôle auth_request (bloc nginx dans le guide de déploiement).
  authelia:
    image: authelia/authelia:4.39.28
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AUTHELIA_LOOPBACK_PORT:-9092}:9091"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET:?AUTHELIA_SESSION_SECRET est requis en prod}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY:?AUTHELIA_STORAGE_ENCRYPTION_KEY est requis en prod}
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_JWT_SECRET:?AUTHELIA_JWT_SECRET est requis en prod}
      AUTHELIA_STORAGE_POSTGRES_PASSWORD: ${AUTHELIA_DB_PASSWORD:?AUTHELIA_DB_PASSWORD est requis en prod}
    volumes:
      - ./authelia/configuration.yml:/config/configuration.yml:ro
      - ./authelia/users_database.yml:/config/users_database.yml:ro
      - authelia_data:/data
  # Sauvegarde quotidienne des bases (D52) : sur le VPS seulement, dans le volume `backups`.
  # Même image que PostgreSQL pour avoir un `pg_dump` de la même version (17).
  backup:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["bash", "/scripts/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-investia}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis}
    volumes:
      - ./backup:/scripts:ro
      - backups:/backups
    healthcheck:
      # unhealthy si aucune sauvegarde réussie depuis plus de 26 h (1560 min).
      test: ["CMD-SHELL", "find /backups/last_success -mmin -1560 2>/dev/null | grep -q ."]
      interval: 1h
      timeout: 10s
      retries: 1
      start_period: 10m

volumes:
  authelia_data:
  backups:

# Prod (VPS) — aucun port publié : tout passe par le réseau Docker interne,
# exposé uniquement via le Nginx Proxy Manager existant.
services:
  postgres:
    restart: unless-stopped
    environment:
      AUTHELIA_DB_PASSWORD: ${AUTHELIA_DB_PASSWORD:?AUTHELIA_DB_PASSWORD est requis en prod}
  redis:
    restart: unless-stopped
  backend:
    restart: unless-stopped
  litellm:
    restart: unless-stopped
  dashboard:
    restart: unless-stopped
    networks:
      default: {}
      npm:
        aliases: [investia-dashboard]
  # Connexion (D50). En prod seulement : en local, aucun Authelia ni NPM devant le dashboard.
  # Aucun port publié : NPM l'appelle par le réseau Docker (voir le guide de déploiement).
  authelia:
    image: authelia/authelia:4.39.28
    restart: unless-stopped
    networks:
      default: {}
      npm:
        aliases: [investia-authelia]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET:?AUTHELIA_SESSION_SECRET est requis en prod}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY:?AUTHELIA_STORAGE_ENCRYPTION_KEY est requis en prod}
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_JWT_SECRET:?AUTHELIA_JWT_SECRET est requis en prod}
      AUTHELIA_STORAGE_POSTGRES_PASSWORD: ${AUTHELIA_DB_PASSWORD:?AUTHELIA_DB_PASSWORD est requis en prod}
    volumes:
      - ./authelia/configuration.yml:/config/configuration.yml:ro
      - ./authelia/users_database.yml:/config/users_database.yml:ro
      - authelia_data:/data
  # Sauvegarde quotidienne des bases (D52) : sur le VPS seulement, dans le volume `backups`.
  # Même image que PostgreSQL pour avoir un `pg_dump` de la même version (17).
  backup:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["bash", "/scripts/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-investia}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis}
    volumes:
      - ./backup:/scripts:ro
      - backups:/backups
    healthcheck:
      # unhealthy si aucune sauvegarde réussie depuis plus de 26 h (1560 min).
      test: ["CMD-SHELL", "find /backups/last_success -mmin -1560 2>/dev/null | grep -q ."]
      interval: 1h
      timeout: 10s
      retries: 1
      start_period: 10m

volumes:
  authelia_data:
  backups:

# Réseau Docker du Nginx Proxy Manager existant (créé par lui, pas par nous).
# Seuls `dashboard` et `authelia` y sont attachés : NPM ne voit ni la base, ni le backend, ni Redis.
networks:
  npm:
    external: true
    name: ${NPM_NETWORK_NAME:?NPM_NETWORK_NAME est requis en prod (voir docker network ls sur le VPS)}

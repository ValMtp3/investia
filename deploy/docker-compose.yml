# Base commune — aucun port publié ici (voir override local / prod).
# Commande officielle : cd deploy && docker compose --env-file ../.env up -d
name: investia

services:
  postgres:
    image: pgvector/pgvector:pg17
    networks:
      default:
        # Nom unique : Authelia (relié aussi au réseau partagé de NPM) ne doit pas confondre
        # ce « postgres » avec celui d'une autre pile.
        aliases: [investia-postgres]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-investia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis}
      # Mot de passe de l'utilisateur « authelia » (D50). Facultatif en local, requis en prod.
      AUTHELIA_DB_PASSWORD: ${AUTHELIA_DB_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-investia}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    networks:
      default:
        aliases: [investia-backend]
    # Liste explicite (D53) : le backend ne voit PAS les secrets d'Authelia ni NPM_NETWORK_NAME.
    # Un nom seul = la variable est transmise telle qu'elle est dans .env, et absente si .env
    # ne la définit pas (le code distingue « pas de clé » de « clé vide »).
    environment:
      - DATABASE_URL
      - REDIS_URL
      - LITELLM_BASE_URL
      - LITELLM_MASTER_KEY
      - APP_SECRET_KEY
      - OPENROUTER_API_KEY
      - MISTRAL_API_KEY
      - TYPESAFE_API_KEY
      - FINNHUB_API_KEY
      - EODHD_API_KEY
      - TWELVEDATA_API_KEY
      - MASSIVE_API_KEY
      - COINGECKO_DEMO_API_KEY
      - STOOQ_API_KEY
      - FRONTEND_ORIGIN
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  litellm:
    image: ghcr.io/berriai/litellm:v1.106.5
    # Liste explicite (D53) : uniquement ce que deploy/litellm/config.yaml référence.
    environment:
      - LITELLM_MASTER_KEY
      - LITELLM_DATABASE_URL
      - OPENROUTER_API_KEY
      - MISTRAL_API_KEY
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    environment:
      # Secret partagé NPM -> dashboard (D53). Vide en local, obligatoire en prod.
      EDGE_SECRET: ${EDGE_SECRET:-}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:

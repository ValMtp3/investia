# Authelia 4.39 — connexion unique (mot de passe seul) devant investia.valentin-fiess.fr (D12, D39).
# D63 (07/11/2026) : la 2FA TOTP a été retirée par le propriétaire (risque assumé) — voir 09-decisions.md.
# AUCUN secret ici (dépôt public, D42) : ils arrivent par variables d'environnement depuis le .env
# (AUTHELIA_SESSION_SECRET, AUTHELIA_STORAGE_ENCRYPTION_KEY,
#  AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET, AUTHELIA_STORAGE_POSTGRES_PASSWORD).

server:
  # Le portail vit sur le chemin /auth du même domaine (D39).
  address: 'tcp://:9091/auth'
  endpoints:
    authz:
      auth-request:
        implementation: 'AuthRequest'

log:
  level: 'info'

authentication_backend:
  # Un seul utilisateur, dans un fichier (voir users_database.example.yml). Pas de réinitialisation
  # de mot de passe par message : pas de serveur d'e-mail, et une surface d'attaque en moins.
  password_reset:
    disable: true
  file:
    path: '/config/users_database.yml'

# TOTP inactif depuis D63 (07/11/2026) : l'enregistrement exigeait un e-mail non configuré,
# le propriétaire a retiré la 2FA (risque assumé). Bloc conservé mais non exigé (policy one_factor).
totp:
  issuer: 'investia.valentin-fiess.fr'

access_control:
  # Tout est fermé par défaut ; le seul domaine ouvert exige le mot de passe seul.
  # D63 : plus de second facteur (TOTP retiré, voir 09-decisions.md).
  default_policy: 'deny'
  rules:
    - domain: 'investia.valentin-fiess.fr'
      policy: 'one_factor'

session:
  name: 'investia_session'
  cookies:
    # Cookie limité à ce sous-domaine : les autres services du VPS ne le reçoivent pas.
    - domain: 'investia.valentin-fiess.fr'
      authelia_url: 'https://investia.valentin-fiess.fr/auth'
      default_redirection_url: 'https://investia.valentin-fiess.fr/'
      # Choix du propriétaire (05/11/2026) : connexion valable 8 h, coupée après 1 h d'inactivité.
      expiration: '8h'
      inactivity: '1h'

storage:
  postgres:
    # Nom unique (alias réseau) sur le réseau interne de la pile (D53).
    address: 'tcp://investia-postgres:5432'
    database: 'authelia'
    username: 'authelia'

notifier:
  # Inactif depuis D63 (plus de TOTP à enregistrer, password_reset désactivé) : conservé car
  # Authelia exige une section notifier valide au démarrage. Aucun e-mail n'est envoyé.
  filesystem:
    filename: '/data/notification.txt'

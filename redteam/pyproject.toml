[project]
name = "investia-redteam"
version = "0.1.0"
description = "Redteam du harness Investia avec garak (NVIDIA) pinné — étape 23j, D104"
requires-python = ">=3.12"
dependencies = [
    "investia",
    "garak==0.17.1",
    "pyyaml>=6.0",
]

[tool.uv.sources]
investia = { path = "../backend" }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

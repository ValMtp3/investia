# nginx du dashboard (D49) : sert les pages et aiguille /api/ vers le backend.
# Dans le réseau Docker, le backend s'appelle « backend » (port 8000).

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Le DNS interne de Docker. Le nom est résolu à chaque requête (valid=10s) :
    # si le backend est recréé avec une nouvelle adresse, pas de 502 durable.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # /api/xxx -> backend:8000/xxx (le préfixe /api est retiré).
    location /api/ {
        set $backend_upstream http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE (/agent/run, /market/stream) : on laisse passer chaque message
        # tout de suite, sans le garder en mémoire, et on tolère un flux long.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Application monopage : toute autre adresse renvoie index.html (le routeur gère).
    location / {
        try_files $uri /index.html;
    }
}

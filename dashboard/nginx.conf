# nginx du dashboard (D49) : sert les pages et aiguille /api/ vers le backend.
# Ce fichier est un modèle : au démarrage, l'image nginx remplace ${EDGE_SECRET} par la valeur
# de la variable d'environnement (voir Dockerfile et docker-compose). Rien d'autre n'est remplacé.
#
# Noms Docker uniques (investia-backend) : sur un réseau partagé avec d'autres piles,
# un nom court comme « backend » pourrait désigner le service d'un autre projet.

# Secret partagé NPM -> dashboard (D53). NPM l'ajoute dans l'en-tête X-Edge-Secret ; sans lui,
# rien ne peut contourner Authelia en appelant ce nginx directement. En prod, ce nginx n'est
# joignable que depuis le VPS (port lié à 127.0.0.1, D54) : le secret protège contre tout
# processus du host qui atteindrait 127.0.0.1 sans lui. En local, EDGE_SECRET est vide :
# l'absence d'en-tête est acceptée.
# EDGE_SECRET fait 64 caractères en prod : une clé de map de 64 caractères ne tient pas dans
# le map_hash_bucket_size par défaut (64) — nginx refuse alors de démarrer avec
# « could not build map_hash » (vu en prod le 07/11/2026 ; en local le secret est vide).
map_hash_bucket_size 128;

map $http_x_edge_secret $edge_authorized {
    default 0;
    "${EDGE_SECRET}" 1;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Le DNS interne de Docker. Le nom est résolu à chaque requête (valid=10s) :
    # si le backend est recréé avec une nouvelle adresse, pas de 502 durable.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Contrôle de santé de Docker : sans secret, ne révèle rien.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # /api/xxx -> investia-backend:8000/xxx (le préfixe /api est retiré).
    location /api/ {
        if ($edge_authorized = 0) {
            return 403;
        }

        set $backend_upstream http://investia-backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE (/agent/run, /market/stream) : on laisse passer chaque message
        # tout de suite, sans le garder en mémoire, et on tolère un flux long.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # /api/agents/ -> investia-backend:8000/api/agents/ (agents A2A, étape 6.1) :
    # préfixe conservé (pas de rewrite), comme /mcp/. Le préfixe le plus long gagne
    # sur /api/, donc cette location est prioritaire pour les agents.
    location /api/agents/ {
        if ($edge_authorized = 0) {
            return 403;
        }

        set $backend_upstream http://investia-backend:8000;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # /mcp/ -> investia-backend:8000/mcp/ (serveur MCP, étape 5.2) : le préfixe est
    # conservé (pas de rewrite), le backend monte le serveur MCP sur /mcp.
    location /mcp/ {
        if ($edge_authorized = 0) {
            return 403;
        }

        set $backend_upstream http://investia-backend:8000;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Streamable HTTP MCP : réponses possiblement SSE, flux sans buffering.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Application monopage : toute autre adresse renvoie index.html (le routeur gère).
    location / {
        if ($edge_authorized = 0) {
            return 403;
        }

        try_files $uri /index.html;
    }
}

[project]
name = "investia-benchmarks"
version = "0.1.0"
description = "Benchmark externe pinné type Harbor/TB 4.1 pour le harness Investia (étape 23h, D102)"
requires-python = ">=3.12"
dependencies = [
    "investia",
    "pyyaml>=6.0",
]

[tool.uv.sources]
investia = { path = "../backend" }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

      - - tool_call: { name: get_quote, arguments: { symbol: "AAPL" } }
        - content: |
            ## Thèse
            Le prix de AAPL est 344.63 $ (source : mock).

            ## Risques
            volatilité.

            ## Confiance
            80

            ## Sources
            - mock

            Simulation — pas un conseil en investissement.
      - - tool_call: { name: get_quote, arguments: { symbol: "AAPL" } }
        - content: |
            ## Thèse
            Le prix de AAPL est 344.63 $ (source : mock).

            ## Risques
            volatilité.

            ## Confiance
            80

            ## Sources
            - mock

            Simulation — pas un conseil en investissement.
      - - tool_call: { name: get_quote, arguments: { symbol: "AAPL" } }
        - content: |
            ## Thèse
            Le prix de AAPL est 344.63 $ (source : mock).

            ## Risques
            volatilité.

            ## Confiance
            80

            ## Sources
            - mock

            Simulation — pas un conseil en investissement.

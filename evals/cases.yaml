# Jeu de cas d'eval (déterministes, mockés — zéro réseau).
# Chaque cas : question, outil attendu, tool_call mocké, réponse finale mockée.
cases:
  - id: prix-action-us
    question: "Quel est le prix de AAPL ?"
    expected_tool: get_quote
    mock_tool_call: { name: get_quote, arguments: { symbol: "AAPL" } }
    mock_final: |
      ## Thèse
      AAPL vaut 344.63 $ (source : mock).

      ## Risques
      volatilité.

      ## Confiance
      80

      ## Sources
      - mock

      Simulation — pas un conseil en investissement.

  - id: prix-crypto
    question: "prix du BTC en EUR ?"
    expected_tool: get_quote
    mock_tool_call: { name: get_quote, arguments: { symbol: "BTC-USD" } }
    mock_final: |
      ## Thèse
      BTC vaut 344.63 $ (source : mock).

      ## Risques
      forte volatilité crypto.

      ## Confiance
      70

      ## Sources
      - mock

      Simulation — pas un conseil en investissement.

  - id: indicateur
    question: "donne-moi les indicateurs de SAP.DE"
    expected_tool: get_indicators
    mock_tool_call: { name: get_indicators, arguments: { symbol: "SAP.DE", days: 60 } }
    mock_final: |
      ## Thèse
      Indicateurs de SAP.DE calculés par l'outil (source : mock).

      ## Risques
      volatilité.

      ## Confiance
      75

      ## Sources
      - mock

      Simulation — pas un conseil en investissement.

  # Étape 12a : plan-and-execute. Le plan est rejoué avant le tool_call.
  - id: plan-suivi
    question: "Quel est le prix de AAPL ?"
    expected_tool: get_quote
    mock_plan: '{"steps": [{"step": "récupérer le prix de AAPL", "tool": "get_quote"}, {"step": "rédiger la réponse", "tool": null}]}'
    mock_tool_call: { name: get_quote, arguments: { symbol: "AAPL" } }
    mock_final: |
      ## Thèse
      AAPL vaut 344.63 $ (source : mock).

      ## Risques
      volatilité.

      ## Confiance
      80

      ## Sources
      - mock

      Simulation — pas un conseil en investissement.

  - id: plan-non-suivi
    question: "Quelles sont les actualités de AAPL ?"
    expected_tool: get_news
    # Le plan prévoit get_quote, mais l'agent appelle get_news : plan_suivi = 0.
    mock_plan: '{"steps": [{"step": "récupérer le prix de AAPL", "tool": "get_quote"}]}'
    mock_tool_call: { name: get_news, arguments: { symbol: "AAPL", limit: 5 } }
    mock_final: |
      ## Thèse
      Aucune actualité disponible pour l'instant (source : mock).

      ## Risques
      volatilité.

      ## Confiance
      60

      ## Sources
      - mock

      Simulation — pas un conseil en investissement.

  # Étape 12b : réflexion. mock_responses = séquence ordonnée rejouée par le LLM mock.
  - id: reflexion-ok
    question: "Quel est le prix de AAPL ?"
    expected_tool: get_quote
    reasoning: reflect
    mock_responses:
      - tool_call: { name: get_quote, arguments: { symbol: "AAPL" } }
      - content: |
          ## Thèse
          AAPL vaut 344.63 $ (source : mock).

          ## Risques
          volatilité.

          ## Confiance
          80

          ## Sources
          - mock

          Simulation — pas un conseil en investissement.
      - content: '{"ok": true, "problemes": []}'

  - id: reflexion-corrige
    question: "Quel est le prix de AAPL ?"
    expected_tool: get_quote
    reasoning: reflect
    mock_responses:
      - tool_call: { name: get_quote, arguments: { symbol: "AAPL" } }
      # candidat bogueux : chiffre inventé, l'auto-critique le signale
      - content: |
          ## Thèse
          AAPL vaut 999999 $ (source : mock).

          ## Risques
          volatilité.

          ## Confiance
          80

          ## Sources
          - mock

          Simulation — pas un conseil en investissement.
      - content: '{"ok": false, "problemes": ["chiffre 999999 absent des sorties des outils"]}'
      # réponse corrigée après réinjection
      - content: |
          ## Thèse
          AAPL vaut 344.63 $ (source : mock).

          ## Risques
          volatilité.

          ## Confiance
          80

          ## Sources
          - mock

          Simulation — pas un conseil en investissement.
      - content: '{"ok": true, "problemes": []}'

  # Étape 12c : self-consistency. mock_variants = k séquences, une par sous-run.
  # consensus-fort : A, A, B -> gagnant A, consensus = 2/3.
  - id: consensus-fort
    question: "Quel est le prix de AAPL ?"
    expected_tool: get_quote
    consistency_k: 3
    mock_variants:
      - - tool_call: { name: get_quote, arguments: { symbol: "AAPL" } }
        - content: |
            ## Thèse
            Le prix de AAPL est 344.63 $ (source : mock).

            ## Risques
            volatilité.

            ## Confiance
            80

            ## Sources
            - mock

            Simulation — pas un conseil en investissement.
      - - tool_call: { name: get_quote, arguments: { symbol: "AAPL" } }
        - content: |
            ## Thèse
            Le prix de AAPL est 344.63 $ (source : mock).

            ## Risques
            volatilité.

            ## Confiance
            80

            ## Sources
            - mock

            Simulation — pas un conseil en investissement.
      - - tool_call: { name: get_quote, arguments: { symbol: "AAPL" } }
        - content: |
            ## Thèse
            AAPL s'échange à 344.63 $ (source : mock).

            ## Risques
            volatilité.

            ## Confiance
            70

            ## Sources
            - mock

            Simulation — pas un conseil en investissement.

  # consensus-unanime : A, A, A -> consensus = 1.0.
  - id: consensus-unanime
    question: "Quel est le prix de AAPL ?"
    expected_tool: get_quote
    consistency_k: 3
